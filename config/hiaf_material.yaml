# Schema
schema: material_schema.yaml

---

G4_Galactic: {from: nist}
G4_AIR: {from: nist}
G4_Ar: {from: nist}
G4_CARBON_DIOXIDE: {from: nist}
G4_Au: {from: nist}
G4_W: {from: nist}
G4_Be: {from: nist}
G4_Cu: {from: nist}
G4_KAPTON: {from: nist}
G4_Pb: {from: nist}        # Reserved for targets.
G4_GRAPHITE: {from: nist}  # Reserved for targets.

mwdc_gas:
  # 80% Ar + 20% CO2
  # density = 0.8 * 1.662e-03 [argon] + 0.2 * 1.842e-03 [carbon dioxide] = 1.698e-03 g/cm3
  color: blue
  alpha: 0.1
  density: 1.698e-03 g/cm3
  components:
    - [G4_Ar, 0.8]
    - [G4_CARBON_DIOXIDE, 0.2]

mwdc_raw_field_wires:
  density: 8.889 g/cm3
  components:
    - [G4_Cu, 0.99]  # 8.935 g/cm3
    - [G4_Be, 0.01]  # 1.845 g/cm3

mwdc_raw_anode_wires:
  density: 19.300 * g/cm3
  components:
    - [G4_W, 0.99]   # 19.3 * g/cm3
    - [G4_Au, 0.01]  # 19.32 * g/cm3

mwdc_raw_cathode_wires:
  alias: mwdc_raw_field_wires

mwdc_up_cathode_wires:
  color: gray
  density: 0.0523060 * g/cm3
  components: [mwdc_raw_cathode_wires]

mwdc_down_cathode_wires:
  color: gray
  density: 0.0261799 * g/cm3
  components: [mwdc_raw_cathode_wires]

mwdc_up_signal_wires:
  color: yellow
  density: 0.0604443 * g/cm3
  components: 
    - [material, mwdc_raw_field_wires, 0.86625]
    - [material, mwdc_raw_anode_wires, 0.13375]

mwdc_down_signal_wires:
  color: yellow
  density: 0.0302221 * g/cm3
  components: 
    - [material, mwdc_raw_field_wires, 0.86625]
    - [material, mwdc_raw_anode_wires, 0.13375]

mwdc_film:
  color: green
  alpha: 0.2
  alias: G4_KAPTON

---

# Comments
# all wire are average density with [up 8cmx8cmx75um, down 16cmx16cmx75um] in MWDC
# cathode layer: 8 cathode wires[Be-Cu], phi=75um
# signal layer: 8 anode wires[W-Au], phi=20um + 8 field wires[Be-Cu], phi=75um 